name: ♻️ 리팩터링
description: 기능 변경 없이 코드 구조를 개선합니다.
title: "[Refactor] "
labels:
  - refactor
body:
  - type: textarea
    id: target
    attributes:
      label: 리팩터링 대상
      description: 개선하려는 코드나 모듈을 설명해 주세요.
      placeholder: "예: UserService의 회원가입 로직"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 리팩터링 이유
      description: 현재 코드가 가진 문제를 설명해 주세요.
      placeholder: "예: 책임이 섞여 있어 테스트와 유지보수가 어렵습니다."
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: 개선 방법
      description: 예정된 변경 방향을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 영향을 받을 수 있는 기능이나 모듈을 작성해 주세요.

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 외부 동작이나 API 명세는 변경되지 않습니다.
          required: true
        - label: 기존 테스트가 통과하는지 확인하겠습니다.
          required: true