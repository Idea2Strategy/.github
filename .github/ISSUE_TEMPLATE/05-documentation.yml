name: 📝 문서 작업
description: 문서를 추가하거나 잘못된 내용을 수정합니다.
title: "[Docs] "
labels:
  - documentation
body:
  - type: dropdown
    id: document
    attributes:
      label: 문서 종류
      options:
        - README
        - API 문서
        - 개발 가이드
        - 배포 및 운영 문서
        - 코드 주석
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 현재 문제
      description: 누락되었거나 잘못된 문서 내용을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: 변경할 내용
    validations:
      required: true