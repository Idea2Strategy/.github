name: 🔧 기타 작업
description: 의존성, 빌드, 설정 및 개발 환경을 관리합니다.
title: "[Chore] "
labels:
  - chore
body:
  - type: dropdown
    id: category
    attributes:
      label: 작업 종류
      options:
        - 의존성 업데이트
        - 빌드 설정
        - CI/CD
        - 개발 환경
        - 코드 스타일 및 린트
        - 파일 및 디렉터리 정리
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 수행해야 할 작업을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 작업 이유
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위