name: ⚡ 성능 개선
description: 속도, 메모리 또는 자원 사용량을 개선합니다.
title: "[Performance] "
labels:
  - performance
body:
  - type: textarea
    id: problem
    attributes:
      label: 성능 문제
      description: 현재 발생하는 성능 문제를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: measurement
    attributes:
      label: 측정 결과
      description: 응답 시간, 처리량, 메모리 사용량 등 측정값을 작성해 주세요.
      placeholder: |
        현재: 평균 응답 시간 1.5초
        목표: 평균 응답 시간 500ms 이하

  - type: textarea
    id: proposal
    attributes:
      label: 개선 방법
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 예상 효과 및 영향 범위